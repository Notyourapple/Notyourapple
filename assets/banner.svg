<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#111118" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Neon Accents Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6D5EFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6D5EFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="glow-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6D5EFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Animations -->
    <style>
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-element {
        animation: float 6s ease-in-out infinite alternate;
      }
      .typing-cursor {
        animation: blink 0.9s infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
      }
      .subtitle-text {
        font-family: 'Fira Code', 'JetBrains Mono', monospace;
        font-weight: 500;
      }
      .tagline-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="1000" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="100" r="220" fill="url(#glow-purple)" class="pulse-glow" />
  <circle cx="820" cy="260" r="240" fill="url(#glow-blue)" class="pulse-glow" />

  <!-- Outer Glassmorphism Card Frame -->
  <rect x="30" y="30" width="940" height="300" rx="14" fill="#111118" fill-opacity="0.6" stroke="url(#glass-border)" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Decorative Top Bar (Window Controls Style) -->
  <circle cx="65" cy="60" r="6" fill="#FF5F56" opacity="0.8" />
  <circle cx="85" cy="60" r="6" fill="#FFBD2E" opacity="0.8" />
  <circle cx="105" cy="60" r="6" fill="#27C93F" opacity="0.8" />
  <line x1="130" y1="60" x2="935" y2="60" stroke="#94A3B8" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Main Hero Graphic Content -->
  <!-- Top Badge: Availability -->
  <g transform="translate(65, 88)">
    <rect width="190" height="28" rx="14" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#22C55E" filter="url(#neon-glow)" />
    <text x="28" y="18" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Large Name -->
  <text x="65" y="175" class="title-text" font-size="46" fill="url(#text-grad)" filter="url(#neon-glow)">
    GAURAB DOWERAH
  </text>

  <!-- Animated Subtitle / Roles -->
  <g transform="translate(65, 220)">
    <rect x="0" y="-20" width="490" height="34" rx="8" fill="#09090B" fill-opacity="0.7" stroke="#6D5EFF" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="2" class="subtitle-text" font-size="15" fill="#38BDF8">
      &gt; <tspan fill="#F8FAFC">Full Stack Developer</tspan> <tspan fill="#8B5CF6">•</tspan> <tspan fill="#F8FAFC">AI Engineer</tspan> <tspan fill="#8B5CF6">•</tspan> <tspan fill="#F8FAFC">Music Producer</tspan>
    </text>
    <rect x="470" y="-12" width="2" height="18" fill="#8B5CF6" class="typing-cursor" />
  </g>

  <!-- Professional Tagline -->
  <text x="65" y="278" class="tagline-text" font-size="15" fill="#94A3B8" letter-spacing="0.3">
    Crafting high-performance SaaS applications, intelligent AI workflows &amp; electronic music.
  </text>

  <!-- Right Decorative Glass Hexagons / Stats Card -->
  <g transform="translate(680, 95)" class="float-element">
    <!-- Outer Card -->
    <rect width="245" height="195" rx="12" fill="#09090B" fill-opacity="0.8" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Code Accent Lines -->
    <path d="M 20 30 L 225 30" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1" />
    
    <!-- Card Header -->
    <text x="20" y="20" font-family="'Fira Code', monospace" font-size="11" fill="#8B5CF6" font-weight="700">// CURRENT_STACK.ts</text>
    
    <!-- Code Lines -->
    <text x="20" y="55" font-family="'Fira Code', monospace" font-size="12" fill="#F8FAFC">
      <tspan fill="#6D5EFF">const</tspan> <tspan fill="#38BDF8">status</tspan> = {
    </text>
    <text x="32" y="80" font-family="'Fira Code', monospace" font-size="12" fill="#94A3B8">
      focus: <tspan fill="#22C55E">"AI &amp; Fullstack"</tspan>,
    </text>
    <text x="32" y="105" font-family="'Fira Code', monospace" font-size="12" fill="#94A3B8">
      alias: <tspan fill="#C084FC">"DRYM MUSIC"</tspan>,
    </text>
    <text x="32" y="130" font-family="'Fira Code', monospace" font-size="12" fill="#94A3B8">
      coffee: <tspan fill="#FFBD2E">"∞ cups"</tspan>,
    </text>
    <text x="32" y="155" font-family="'Fira Code', monospace" font-size="12" fill="#94A3B8">
      mode: <tspan fill="#38BDF8">"Building 🚀"</tspan>
    </text>
    <text x="20" y="180" font-family="'Fira Code', monospace" font-size="12" fill="#F8FAFC">};</text>
  </g>

</svg>
