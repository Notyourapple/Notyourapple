<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e131f" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Overlays -->
  <rect width="1200" height="500" rx="16" fill="url(#purpleGlow)" />
  <rect width="1200" height="500" rx="16" fill="url(#blueGlow)" />

  <!-- Subtle Cyber Grid -->
  <rect width="1200" height="500" rx="16" fill="url(#grid)" />

  <!-- Main Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="498" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top System Status Bar -->
  <g transform="translate(60, 45)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="165" height="28" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="26" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SYSTEM // ONLINE</text>

    <!-- Terminal Identifier -->
    <rect x="175" y="0" width="155" height="28" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <text x="187" y="18" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">PORT: 2026 // PROD</text>

    <!-- Right-aligned Profile Tag -->
    <text x="1080" y="18" text-anchor="end" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600">@Notyourapple • v2.4.0</text>
  </g>

  <!-- Left Content Area -->
  <!-- Badge -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="190" height="26" rx="6" fill="#581c87" fill-opacity="0.4" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <text x="12" y="17" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">⚡ DEVELOPER PROFILE</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="195" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">GAURAB DOWERAH</text>

  <!-- Role Subtitle -->
  <text x="60" y="235" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" letter-spacing="0.5">Full Stack Developer • AI Engineer</text>

  <!-- Description Text -->
  <g fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
    <text x="60" y="278">Building intelligent applications, AI-powered systems,</text>
    <text x="60" y="302">and scalable digital experiences.</text>
  </g>

  <!-- Tech Stack Feature Pills -->
  <g transform="translate(60, 335)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="115" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="14" y="19" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Full Stack</text>

    <!-- Pill 2 -->
    <rect x="125" y="0" width="125" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="139" y="19" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">AI Integration</text>

    <!-- Pill 3 -->
    <rect x="260" y="0" width="115" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="274" y="19" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">TypeScript</text>

    <!-- Pill 4 -->
    <rect x="385" y="0" width="95" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="399" y="19" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Python</text>
  </g>

  <!-- Right Code Card Component -->
  <g transform="translate(630, 95)">
    <!-- Card Outer Glow / Shadow Base -->
    <rect x="0" y="0" width="510" height="295" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Card Header / Title Bar -->
    <rect x="0" y="0" width="510" height="38" rx="12" fill="#1e293b" fill-opacity="0.85" />
    <!-- Square off bottom corners of header -->
    <rect x="0" y="24" width="510" height="14" fill="#1e293b" fill-opacity="0.85" />
    <line x1="0" y1="38" x2="510" y2="38" stroke="#334155" stroke-width="1" />

    <!-- Window Control Buttons -->
    <circle cx="20" cy="19" r="6" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" fill-opacity="0.85" />
    <circle cx="56" cy="19" r="6" fill="#10b981" fill-opacity="0.85" />

    <!-- File Tab Title -->
    <rect x="80" y="8" width="145" height="22" rx="4" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="0.75" />
    <text x="92" y="23" fill="#94a3b8" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="500">gaurab.config.ts</text>

    <!-- Language Badge -->
    <text x="490" y="23" text-anchor="end" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="11">TypeScript</text>

    <!-- Code Content Area -->
    <g font-family="'Courier New', Courier, monospace" font-size="13" font-weight="500">
      <!-- Line 1 -->
      <text x="20" y="70" fill="#475569">01</text>
      <text x="55" y="70" fill="#f43f5e">const</text>
      <text x="98" y="70" fill="#38bdf8">gaurab</text>
      <text x="148" y="70" fill="#94a3b8">=</text>
      <text x="162" y="70" fill="#e2e8f0">{</text>

      <!-- Line 2 -->
      <text x="20" y="96" fill="#475569">02</text>
      <text x="75" y="96" fill="#c084fc">name</text>
      <text x="106" y="96" fill="#94a3b8">:</text>
      <text x="122" y="96" fill="#34d399">"Gaurab Dowerah"</text>
      <text x="246" y="96" fill="#94a3b8">,</text>

      <!-- Line 3 -->
      <text x="20" y="122" fill="#475569">03</text>
      <text x="75" y="122" fill="#c084fc">role</text>
      <text x="106" y="122" fill="#94a3b8">:</text>
      <text x="122" y="122" fill="#34d399">"Full Stack Developer"</text>
      <text x="306" y="122" fill="#94a3b8">,</text>

      <!-- Line 4 -->
      <text x="20" y="148" fill="#475569">04</text>
      <text x="75" y="148" fill="#c084fc">focus</text>
      <text x="114" y="148" fill="#94a3b8">:</text>
      <text x="130" y="148" fill="#34d399">"AI &amp; Scalable Web"</text>
      <text x="284" y="148" fill="#94a3b8">,</text>

      <!-- Line 5 -->
      <text x="20" y="174" fill="#475569">05</text>
      <text x="75" y="174" fill="#c084fc">stack</text>
      <text x="114" y="174" fill="#94a3b8">:</text>
      <text x="130" y="174" fill="#94a3b8">[</text>
      <text x="138" y="174" fill="#34d399">"React"</text>
      <text x="194" y="174" fill="#94a3b8">, </text>
      <text x="210" y="174" fill="#34d399">"Next.js"</text>
      <text x="282" y="174" fill="#94a3b8">, </text>
      <text x="298" y="174" fill="#34d399">"Python"</text>
      <text x="362" y="174" fill="#94a3b8">]</text>
      <text x="370" y="174" fill="#94a3b8">,</text>

      <!-- Line 6 -->
      <text x="20" y="200" fill="#475569">06</text>
      <text x="75" y="200" fill="#c084fc">status</text>
      <text x="122" y="200" fill="#94a3b8">:</text>
      <text x="138" y="200" fill="#34d399">"Building Active Systems"</text>
      <text x="338" y="200" fill="#94a3b8">,</text>

      <!-- Line 7 -->
      <text x="20" y="226" fill="#475569">07</text>
      <text x="75" y="226" fill="#c084fc">passion</text>
      <text x="130" y="226" fill="#94a3b8">:</text>
      <text x="146" y="226" fill="#34d399">"AI Engineering"</text>

      <!-- Line 8 -->
      <text x="20" y="252" fill="#475569">08</text>
      <text x="55" y="252" fill="#e2e8f0">};</text>
    </g>

    <!-- Card Footer Status -->
    <line x1="0" y1="268" x2="510" y2="268" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="285" fill="#10b981" font-family="'Courier New', Courier, monospace" font-size="10">● Ready to Deploy</text>
    <text x="490" y="285" text-anchor="end" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10">UTF-8 • Ln 8, Col 3</text>
  </g>

  <!-- Bottom Telemetry & Divider -->
  <line x1="60" y1="440" x2="1140" y2="440" stroke="#1e293b" stroke-width="1" />

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(60, 465)" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="600">
    <text x="0" y="0">// ARCHITECTURE: CLOUD &amp; FULL-STACK</text>
    <text x="400" y="0">// FOCUS: AI-POWERED DIGITAL EXPERIENCES</text>
    <text x="1080" y="0" text-anchor="end" fill="#38bdf8">// STATUS: READY</text>
  </g>
</svg>
