<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050711" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="105" fill="url(#inner-glow)" />

  <!-- Outer Orbit Track -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Outer Neon Ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="url(#ring-grad)" stroke-width="3" stroke-dasharray="130 35 70 25" />

  <!-- Inner Dark Frame -->
  <circle cx="120" cy="120" r="84" fill="#090d1a" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Tech Dots / Orbs on Edge -->
  <circle cx="120" cy="28" r="4.5" fill="#38BDF8" />
  <circle cx="212" cy="120" r="4.5" fill="#8B5CF6" />
  <circle cx="28" cy="120" r="4.5" fill="#10B981" />

  <!-- Avatar Silhouette Graphics (Developer Icon) -->
  <circle cx="120" cy="98" r="30" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="1.5" />
  <path d="M 72 165 C 72 135, 168 135, 168 165 Z" fill="#6366F1" fill-opacity="0.25" stroke="#6366F1" stroke-width="1.5" />

  <!-- Online Status Pill at Bottom -->
  <g transform="translate(50, 192)">
    <rect width="140" height="24" rx="12" fill="#060913" stroke="#10B981" stroke-opacity="0.8" stroke-width="1.2" />
    <circle cx="16" cy="12" r="3.5" fill="#10B981" />
    <text x="28" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">OPEN TO WORK</text>
  </g>
</svg>
