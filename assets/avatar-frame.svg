<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6D5EFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <filter id="avatar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .spin-ring {
        transform-origin: 120px 120px;
        animation: spin 12s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#inner-glow)" />

  <!-- Animated Outer Ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="url(#ring-grad)" stroke-width="3" stroke-dasharray="140 30 60 20" class="spin-ring" filter="url(#avatar-glow)" />

  <!-- Inner Dark Frame -->
  <circle cx="120" cy="120" r="84" fill="#111118" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Avatar Placeholder Graphics (Stylized Dev Icon) -->
  <circle cx="120" cy="100" r="32" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 68 175 C 68 140, 172 140, 172 175 Z" fill="#6D5EFF" fill-opacity="0.2" stroke="#6D5EFF" stroke-width="2" />

  <!-- Tech Dots / Orbs on Edge -->
  <circle cx="120" cy="28" r="5" fill="#38BDF8" filter="url(#avatar-glow)" />
  <circle cx="212" cy="120" r="5" fill="#8B5CF6" filter="url(#avatar-glow)" />
  <circle cx="28" cy="120" r="5" fill="#22C55E" filter="url(#avatar-glow)" />

  <!-- Status Pill at Bottom -->
  <g transform="translate(60, 192)">
    <rect width="120" height="24" rx="12" fill="#09090B" stroke="#22C55E" stroke-opacity="0.8" stroke-width="1.5" />
    <circle cx="16" cy="12" r="4" fill="#22C55E" filter="url(#avatar-glow)" />
    <text x="28" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">ONLINE</text>
  </g>
</svg>
