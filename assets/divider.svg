<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="100%">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="20%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6D5EFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <filter id="div-glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Line -->
  <line x1="50" y1="15" x2="950" y2="15" stroke="url(#div-grad)" stroke-width="2" filter="url(#div-glow)" />

  <!-- Central Sparkle / Diamond -->
  <g transform="translate(500, 15)">
    <polygon points="0,-8 6,0 0,8 -6,0" fill="#8B5CF6" filter="url(#div-glow)" />
    <circle cx="0" cy="0" r="3" fill="#F8FAFC" />
  </g>
  <circle cx="430" cy="15" r="2.5" fill="#6D5EFF" opacity="0.8" />
  <circle cx="570" cy="15" r="2.5" fill="#38BDF8" opacity="0.8" />
</svg>
