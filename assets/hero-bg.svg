<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="50%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <radialGradient id="purple-orb" cx="25%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-orb" cx="80%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B5CF6" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dot-grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="140" r="280" fill="url(#purple-orb)"/>
  <circle cx="950" cy="260" r="260" fill="url(#blue-orb)"/>

  <!-- Geometric Abstract Cyber Lines -->
  <path d="M -50 220 Q 350 40 750 240 T 1300 160" fill="none" stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1.8"/>
  <path d="M -50 270 Q 450 90 850 290 T 1300 210" fill="none" stroke="#38BDF8" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
