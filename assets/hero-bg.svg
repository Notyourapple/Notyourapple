<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <radialGradient id="purple-orb" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-orb" cx="75%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#6D5EFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8B5CF6" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dot-grid)"/>

  <!-- Orbs -->
  <circle cx="360" cy="160" r="300" fill="url(#purple-orb)"/>
  <circle cx="900" cy="240" r="280" fill="url(#blue-orb)"/>

  <!-- Geometric Abstract Lines -->
  <path d="M -100 200 Q 300 50 700 250 T 1300 150" fill="none" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M -100 250 Q 400 100 800 300 T 1300 200" fill="none" stroke="#6D5EFF" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
